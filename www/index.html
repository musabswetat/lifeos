<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#F2F2F7" id="themeColorMeta">

    <title>Life OS</title>
    
    <!-- ☁️ مكتبات Firebase السحابية الرسمية -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-canvas: #121212;
            --surface-card: #1E1E1E;
            --surface-inner: #282828;
            --surface-active: #323232;
            --border-subtle: #2C2C2C;
            --text-primary: #FFFFFF;
            --text-secondary: #8E8E93;
            --accent-color: #007AFF;
            --accent-green: #34C759;
            --accent-red: #FF3B30;
            --radius-card: 26px;
            --radius-input: 14px;
            --radius-pill: 9999px;
            --font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --dock-height: 56px;
            --shadow-subtle: 0 4px 20px rgba(0, 0, 0, 0.25);
            --card-backdrop: none;
        }

        body.theme-oneui.light-mode {
            --bg-canvas: #F2F2F7;
            --surface-card: #FFFFFF;
            --surface-inner: #E5E5EA;
            --border-subtle: #E5E5EA;
            --text-primary: #000000;
            --text-secondary: #6C6C70;
            --shadow-subtle: 0 4px 16px rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            -webkit-tap-highlight-color: transparent;
        }

        ::-webkit-scrollbar { display: none !important; }
        * { scrollbar-width: none !important; }

        body {
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: background 0.25s ease, color 0.25s ease;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 12px 18px calc(var(--dock-height) + 85px) 18px;
            box-sizing: border-box;
        }

        .oneui-top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 2px;
            position: relative;
        }
        .top-prayer-info {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-green, #34C759);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .top-actions-cluster {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .top-action-btn {
            background: transparent;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s ease;
        }
        .top-action-btn svg { width: 20px; height: 20px; fill: currentColor; }

        .user-auth-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            padding: 6px 14px;
            border-radius: var(--radius-pill);
            cursor: pointer;
            box-shadow: var(--shadow-subtle);
            font-size: 12px;
            font-weight: 700;
        }

        .oneui-header-area { padding: 12px 2px 18px 2px; }
        .oneui-title-hero { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 0; }
        .oneui-sub-text { font-size: 13px; color: var(--text-secondary); font-weight: 500; line-height: 1.6; }
        .oneui-currency-line { font-size: 13px; color: var(--text-secondary); font-weight: 500; margin-top: 3px; }

        .circular-timer-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 0 6px 0;
            cursor: pointer;
        }
        .circular-timer-box {
            position: relative;
            width: 130px;
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease;
        }
        .timer-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }
        .timer-bg-circle { fill: none; stroke: var(--surface-inner); stroke-width: 7; }
        .timer-progress-circle {
            fill: none;
            stroke: var(--accent-color);
            stroke-width: 7;
            stroke-linecap: round;
            stroke-dasharray: 326.72;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 0.5s ease;
        }
        .timer-text-content { position: relative; text-align: center; z-index: 2; }
        .timer-time-large { font-size: 20px; font-weight: 800; color: var(--text-primary); }
        .timer-label-sub { font-size: 11px; font-weight: 600; color: var(--text-secondary); margin-top: 2px; max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .section-label {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
            margin: 16px 4px 8px 4px;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }
        .oneui-card {
            background: var(--surface-card);
            border-radius: var(--radius-card);
            border: 1px solid var(--border-subtle);
            padding: 18px 20px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-subtle);
        }

        .section-view { display: none; }
        .section-view.active { display: block; animation: oneuiFade 0.25s cubic-bezier(0.2, 0, 0, 1); }
        @keyframes oneuiFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        .list-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 13px 0;
            border-bottom: 1px solid var(--border-subtle);
            font-size: 14px;
            gap: 10px;
        }
        .list-row:last-child { border-bottom: none; }

        .tag-badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            border-radius: var(--radius-pill);
            font-size: 12px;
            font-weight: 700;
            background: var(--surface-inner);
            color: var(--accent-color);
            border: 1px solid var(--border-subtle);
            cursor: pointer;
        }
        .tag-badge.green { color: var(--accent-green, #34C759); }

        .samsung-dock-container {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-pill);
            padding: 5px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            width: calc(100% - 40px);
            max-width: 380px;
        }
        .samsung-dock-item {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px 12px;
            border-radius: var(--radius-pill);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }
        .samsung-dock-item.active { background: var(--surface-inner); color: var(--text-primary); }

        .app-input {
            padding: 12px 14px;
            background: var(--surface-inner) !important;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-input);
            color: var(--text-primary) !important;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        .btn-action {
            background: var(--accent-color);
            color: #FFFFFF;
            border: none;
            padding: 13px 18px;
            border-radius: var(--radius-input);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            z-index: 99999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-card);
            padding: 24px;
            width: 100%;
            max-width: 380px;
        }

        #syncToast {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            padding: 6px 16px;
            border-radius: var(--radius-pill);
            font-size: 12px;
            font-weight: 700;
            opacity: 0;
            transition: opacity 0.25s ease;
            z-index: 9999;
            pointer-events: none;
        }
        #syncToast.show { opacity: 1; }
    </style>
</head>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCxalyr_Xa7IeSuT8enh6MCu2a1h5HvBWY",
            authDomain: "life-8892e.firebaseapp.com",
            databaseURL: "https://life-8892e-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "life-8892e",
            storageBucket: "life-8892e.firebasestorage.app",
            messagingSenderId: "164493970016",
            appId: "1:164493970016:web:96fffd7b5507e86cfb5105",
            measurementId: "G-FTWWK20CBS"
        };
        firebase.initializeApp(firebaseConfig);
        
        let currentUser = null;
        let userDbRef = null;

        function normalizeDB(data) {
            if (!data) data = {};
            const lists = ['fixed_bills', 'subscriptions', 'purchases', 'vault', 'notes', 'documents', 'todos', 'expenses', 'reminders'];
            lists.forEach(key => {
                if (data[key]) {
                    if (!Array.isArray(data[key])) { data[key] = Object.values(data[key]).filter(i => i !== null); }
                } else { data[key] = []; }
            });
            if (!data.settings) data.settings = { darkMode: false };
            return data;
        }

        let db = normalizeDB(JSON.parse(localStorage.getItem('myLifeAppDB') || '{}'));
        const todayStr = new Date().toISOString().split('T')[0];
        let livePrayersList = [];

        function showToast(msg) {
            const el = document.getElementById('syncToast');
            if(!el) return;
            el.innerText = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 2000);
        }

        function saveToCloud() {
            if (userDbRef) {
                userDbRef.set(db);
            }
        }

        // =========================================================================
        // --- 🛡️ محرك التنبيهات المعتمد لأندرويد (Alarm Stream + Exact Alarms) ---
        // =========================================================================
        
        function getNativePlugin() {
            if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications) {
                return window.Capacitor.Plugins.LocalNotifications;
            }
            return null;
        }

        async function initNativeNotifications() {
            const plugin = getNativePlugin();
            if (!plugin) return;

            try {
                await plugin.requestPermissions();
                
                // إنشاء قناة منبه ذات أولوية قصوى واختراق الصامت
                await plugin.createChannel({
                    id: 'lifeos_exact_alarm_channel_v1',
                    name: 'منبهات Life OS الفائقة',
                    description: 'قناة المنبهات الرسمية ذات الأولوية القصوى',
                    importance: 5, // MAX / HIGH
                    visibility: 1, // PUBLIC (تظهر فوق شاشة القفل)
                    sound: 'marimba', // صوت المنبه
                    vibration: true,
                    lights: true
                });

                await plugin.registerActionTypes({
                    types: [{
                        id: 'ALARM_ACTIONS',
                        actions: [{ id: 'dismiss_alarm', title: '🔕 إيقاف المنبه', destructive: true }]
                    }]
                });
            } catch (e) {
                console.error("فشل تهيئة قناة المنبه:", e);
            }
        }
        initNativeNotifications();

        // جدولة المنبه الصارم بنظام allowWhileIdle
        async function scheduleSystemNotification(title, minutes, reminderId) {
            const plugin = getNativePlugin();
            if (!plugin) return;

            const notifTitle = title ? `⏰ منبه: ${title}` : `⏰ موعد المنبه (${minutes} دقيقة)!`;
            const notifBody = title ? `حان الآن موعد: ${title}` : `انتهت مدة المنبه المحددة`;
            const targetDate = new Date(Date.now() + minutes * 60 * 1000);
            const safeId = Math.abs(Number(reminderId) % 2147483647);

            try {
                await plugin.schedule({
                    notifications: [{
                        title: notifTitle,
                        body: notifBody,
                        id: safeId,
                        schedule: { at: targetDate, allowWhileIdle: true },
                        sound: 'marimba',
                        actionTypeId: 'ALARM_ACTIONS',
                        channelId: 'lifeos_exact_alarm_channel_v1'
                    }]
                });
            } catch (err) {
                console.error("تعذر جدولة الإشعار:", err);
            }
        }

        // طلب تجاوز توفير البطارية برمجياً
        function requestBatteryOptimizationExemption() {
            alert('لضمان عمل المنبه بدقة متناهية والتطبيق مغلق:\n\n1. اختر "غير مقيد" (Unrestricted) في صفحة استهلاك البطارية.\n2. تأكد من تفعيل "التشغيل التلقائي" (Autostart) إن وجد.');
        }

        function addReminderFast(mins, title = '') {
            const now = Date.now();
            const reminderId = Date.now();
            const cleanTitle = title.trim();

            db.reminders.push({
                id: reminderId,
                title: cleanTitle,
                minutes: mins,
                createdAt: now,
                targetTime: now + (mins * 60 * 1000),
                triggered: false,
                hasName: !!cleanTitle
            });

            finalizeAction();
            scheduleSystemNotification(cleanTitle, mins, reminderId);
            showToast(`⏰ تم ضبط منبه ${mins} دقيقة`);
        }

        function confirmDeleteReminder(id) {
            if (confirm('هل تريد إلغاء التنبيه الحالي؟')) {
                const numId = Number(id);
                const plugin = getNativePlugin();
                if (plugin) {
                    plugin.cancel({ notifications: [{ id: Math.abs(numId % 2147483647) }] }).catch(() => {});
                }
                db.reminders = db.reminders.filter(r => Number(r.id) !== numId);
                finalizeAction();
            }
        }

        function renameReminder(id) {
            const r = db.reminders.find(x => x.id === id);
            if (!r) return;
            const newName = prompt('أدخل اسم المنبه:', r.title || '');
            if (newName !== null) {
                r.title = newName.trim() || 'منبه';
                finalizeAction();
            }
        }

        function formatTime(ms) {
            if (ms <= 0) return '00:00';
            const s = Math.floor(ms / 1000);
            const hrs = Math.floor(s / 3600);
            const mins = Math.floor((s % 3600) / 60);
            const secs = s % 60;
            if (hrs > 0) return `${hrs}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        // --- تحديث المؤقت اللحظي على الشاشة ---
        function renderPrayersAndReminders() {
            const now = Date.now();
            const activeReminders = db.reminders.filter(r => !r.triggered && r.targetTime > now);
            activeReminders.sort((a,b) => a.targetTime - b.targetTime);

            const countText = document.getElementById('activeRemindersCountText');
            if (countText) countText.innerText = `${activeReminders.length} تنبيهات نشطة`;

            const nearest = activeReminders[0];
            const circle = document.getElementById('timerProgressCircle');
            const timeEl = document.getElementById('nearestTimerTime');
            const labelEl = document.getElementById('nearestTimerLabel');

            if (nearest) {
                const remainingMs = nearest.targetTime - now;
                const totalDuration = (nearest.minutes * 60 * 1000) || (nearest.targetTime - nearest.createdAt) || remainingMs;
                const fraction = Math.max(0, Math.min(1, remainingMs / totalDuration));
                const strokeTotal = 326.72;
                
                if (circle) circle.style.strokeDashoffset = strokeTotal * (1 - fraction);
                if (timeEl) timeEl.innerText = formatTime(remainingMs);
                if (labelEl) labelEl.innerText = nearest.title || `تنبيه (${nearest.minutes} د)`;
            } else {
                if (circle) circle.style.strokeDashoffset = 326.72;
                if (timeEl) timeEl.innerText = "--:--";
                if (labelEl) labelEl.innerText = "لا توجد تنبيهات";
            }

            const dashRemPreview = document.getElementById('dashRemindersPreview');
            if (dashRemPreview) {
                const restReminders = activeReminders.slice(1, 3);
                dashRemPreview.innerHTML = restReminders.map(r => `
                    <div class="list-row">
                        <div>
                            <strong>${r.title || `منبه (${r.minutes} د)`}</strong>
                            <div style="font-size:12px; color:var(--text-secondary);">${new Date(r.targetTime).toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'})}</div>
                        </div>
                        <div style="display:flex; align-items:center; gap:6px;">
                            <button onclick="renameReminder(${r.id})" class="tag-badge">✏️</button>
                            <span class="tag-badge">⏳ ${formatTime(r.targetTime - now)}</span>
                            <button onclick="confirmDeleteReminder(${r.id})" style="background:none; border:none; color:var(--accent-red); cursor:pointer;">✖</button>
                        </div>
                    </div>
                `).join('');
            }
        }

        setInterval(renderPrayersAndReminders, 1000);

        function finalizeAction() {
            localStorage.setItem('myLifeAppDB', JSON.stringify(db));
            saveToCloud();
            renderPrayersAndReminders();
        }

        function switchNavSection(viewId, btnEl) {
            document.querySelectorAll('.section-view').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.samsung-dock-item').forEach(b => b.classList.remove('active'));
            const target = document.getElementById(viewId);
            if(target) target.classList.add('active');
            if(btnEl) btnEl.classList.add('active');
        }

        function toggleTheme() {
            db.settings.darkMode = !db.settings.darkMode;
            document.body.classList.toggle('light-mode', !db.settings.darkMode);
            finalizeAction();
        }

        function openModalAction(type) {
            const modal = document.getElementById('actionModal');
            const title = document.getElementById('modalTitle');
            const container = document.getElementById('modalFormContainer');

            if (type === 'alarm') {
                title.innerText = '⏰ ضبط تنبيه سريع';
                container.innerHTML = `
                    <input type="number" id="actAlarmMins" placeholder="عدد الدقائق..." class="app-input" required>
                    <input type="text" id="actAlarmTitle" placeholder="اسم التنبيه (اختياري)..." class="app-input">
                    <button type="button" onclick="submitActAlarm()" class="btn-action">ضبط الآن</button>
                `;
            }
            modal.classList.add('active');
        }

        function submitActAlarm() {
            const mins = parseInt(document.getElementById('actAlarmMins').value);
            const title = document.getElementById('actAlarmTitle').value;
            if (!mins || mins <= 0) return alert('أدخل دقائق صحيحة');
            addReminderFast(mins, title);
            closeModalAction();
        }

        function closeModalAction() {
            document.getElementById('actionModal').classList.remove('active');
        }

        async function requestNotificationPermission() {
            const plugin = getNativePlugin();
            if (plugin) {
                try {
                    const res = await plugin.requestPermissions();
                    if (res.display === 'granted') {
                        alert('✅ تم تفعيل قناة المنبهات القصوى بنجاح!');
                    }
                } catch(e) {}
            }
        }

        document.body.classList.toggle('light-mode', !db.settings.darkMode);
        renderPrayersAndReminders();
    </script>
</body>
</html>
